name: Publish project site
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pages.yml
      - docs/**
      - Retrieval_method.html
      - Variables_and_equations.html
      - SymbolicTensors.html
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble static site
        run: |
          mkdir -p _site/assets
          cp docs/index.html docs/site.css Retrieval_method.html Variables_and_equations.html SymbolicTensors.html _site/
          cp docs/assets/*.png _site/assets/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
